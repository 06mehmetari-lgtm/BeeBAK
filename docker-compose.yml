services:
  postgres:
    image: postgres:16-alpine
    container_name: beebak-postgres
    restart: always
    environment:
      POSTGRES_DB: BeeBAK
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 11051994
    volumes:
      - beebak_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BeeBAK"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: beebak-redis
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec --protected-mode no
    volumes:
      - beebak_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: beebak-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: beebak
      RABBITMQ_DEFAULT_PASS: beebak
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: beebak-flaresolverr
    restart: always
    shm_size: 1g
    environment:
      LOG_LEVEL: "info"
      TZ: "Europe/Istanbul"
    ports:
      - "8191:8191"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1500M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8191/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  selenium-hub:
    image: selenium/hub:4.27.0
    container_name: beebak-selenium-hub
    restart: always
    environment:
      SE_NODE_MAX_SESSIONS: "4"
      GRID_NEW_SESSION_WAIT_TIMEOUT: "60000"
      GRID_BROWSER_TIMEOUT: "180"
      GRID_TIMEOUT: "300"
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/wd/hub/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  chrome-node:
    image: selenium/node-chrome:4.27.0
    restart: always
    shm_size: 512m
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_NODE_MAX_SESSIONS: "2"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_NODE_SESSION_TIMEOUT: "180"
      SE_VNC_NO_PASSWORD: "1"
      SE_OPTS: "--detect-drivers true"
    deploy:
      # 2 node × 2 session = 4 eş zamanlı Selenium — bellek güvenli
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 700M

  dbmigrator:
    build:
      context: .
      dockerfile: Dockerfile.dbmigrator
    container_name: beebak-dbmigrator
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=BeeBAK;Username=postgres;Password=11051994"
      Redis__Configuration: "redis:6379"
      Redis__InstanceName: "BeeBAK:"
      BackgroundJobs__IsJobExecutionEnabled: "false"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: beebak-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      dbmigrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=BeeBAK;Username=postgres;Password=11051994"
      Redis__Configuration: "redis:6379"
      RabbitMq__Connections__Default__HostName: "rabbitmq"
      RabbitMq__Connections__Default__Port: "5672"
      RabbitMq__Connections__Default__UserName: "beebak"
      RabbitMq__Connections__Default__Password: "beebak"
      BackgroundJobs__IsJobExecutionEnabled: "false"
      App__SelfUrl: "http://localhost:44381"
      App__CorsOrigins: "http://localhost:4200,https://localhost:4200"
      App__RedirectAllowedUrls: "http://localhost:4200"
      AuthServer__Authority: "http://localhost:44381"
      AuthServer__RequireHttpsMetadata: "false"
      AuthServer__UseDevelopmentCertificate: "true"
      App__HealthUiCheckUrl: "http://localhost:8080/health-status"
      Akakce__BaseUrl: "https://www.akakce.com"
      Akakce__AllowedAkakceHostSuffix: "akakce.com"
      Akakce__SeleniumGridUrl: "http://selenium-hub:4444/wd/hub"
      Akakce__SeleniumHeadless: "true"
      Akakce__BlockImages: "true"
      Akakce__BlockFonts: "true"
      Akakce__UseQueue: "true"
      Akakce__DefaultMaxPages: "1"
      Akakce__DefaultMaxProducts: "10"
    ports:
      - "44381:8080"
    volumes:
      - beebak_dataprotection:/root/.aspnet/DataProtection-Keys
    deploy:
      resources:
        limits:
          memory: 768M

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f BeeBAK.WorkerHost || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1024M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy
      flaresolverr:
        condition: service_healthy
      dbmigrator:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: "Production"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=BeeBAK;Username=postgres;Password=11051994"
      Redis__Configuration: "redis:6379"
      RabbitMq__Connections__Default__HostName: "rabbitmq"
      RabbitMq__Connections__Default__Port: "5672"
      RabbitMq__Connections__Default__UserName: "beebak"
      RabbitMq__Connections__Default__Password: "beebak"
      RabbitMq__Connections__Default__RequestedHeartbeat: "30"
      RabbitMq__Connections__Default__NetworkRecoveryInterval: "10"
      RabbitMq__Connections__Default__AutomaticRecoveryEnabled: "true"
      BackgroundJobs__IsJobExecutionEnabled: "true"
      # ── Akakce Selenium ──────────────────────────────────────────────────
      Akakce__BaseUrl: "https://www.akakce.com"
